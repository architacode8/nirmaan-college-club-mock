<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0088CC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Tri-Node Circuit Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-dasharray="8 4 16 4" filter="url(#glow)"/>
  <circle cx="50" cy="8" r="4" fill="#00F0FF" />
  <circle cx="14" cy="71" r="4" fill="#0088CC" />
  <circle cx="86" cy="71" r="4" fill="#00F0FF" />
  
  <!-- Circuit traces -->
  <path d="M50 12 L50 28 M17 69 L30 62 M83 69 L70 62" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center Hexagon / Terminal Shield -->
  <polygon points="50,26 74,38 74,64 50,76 26,64 26,38" stroke="#00F0FF" stroke-width="2" fill="#0D121D"/>
  
  <!-- Code Execution Terminal Cursor & Brackets -->
  <path d="M38 45 L45 51 L38 57" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="48" y1="57" x2="60" y2="57" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Spark node -->
  <circle cx="62" cy="45" r="2" fill="#00F0FF" filter="url(#glow)"/>
</svg>
